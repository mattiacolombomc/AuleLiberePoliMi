version: '3.8'

services:
  # Telegram Bot
  bot:
    build: .
    container_name: aulelibere-bot
    restart: unless-stopped
    environment:
      - TOKEN=${TOKEN}
      - DEVELOPER_CHAT_ID=${DEVELOPER_CHAT_ID}
      - CHANNEL_ID=${CHANNEL_ID}
      - ADMIN_ID=${ADMIN_ID}
      - USE_WEBHOOK=${USE_WEBHOOK:-false}
    volumes:
      # Persist bot data (conversation state)
      - ./data:/app/data
      # Persist logs
      - ./log:/app/log
    ports:
      - "8080:8080"
    networks:
      - bot-network

  # Portainer - Docker Management UI
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge

volumes:
  portainer_data:
